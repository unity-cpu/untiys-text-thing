<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Unity Text Thing</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Trispace&display=swap">
<style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
        min-height: 100vh;
        font-family: "Trispace", sans-serif;
        background: #000;
        color: #fff;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 60px 16px 40px;
        position: relative;
    }
    body::after {
        content: "";
        position: fixed;
        width: 600px;
        height: 600px;
        left: 50%;
        top: 35%;
        transform: translate(-50%, -50%);
        background: rgba(168, 85, 247, 0.18);
        filter: blur(120px);
        border-radius: 50%;
        pointer-events: none;
        z-index: 0;
    }
    h1 {
        position: relative;
        z-index: 2;
        margin-bottom: 28px;
        font-size: 1.75rem;
        letter-spacing: 3px;
        background: linear-gradient(135deg, #a855f7, #e9d5ff);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
    }
    .box {
        position: relative;
        z-index: 2;
        width: 420px;
        max-width: 100%;
        padding: 24px;
        border-radius: 18px;
        background: rgba(30, 20, 40, 0.7);
        border: 1px solid rgba(168, 85, 247, 0.4);
        box-shadow: 0 0 30px rgba(168, 85, 247, 0.2);
        margin-bottom: 16px;
    }
    input {
        width: 100%;
        padding: 14px 16px;
        margin-bottom: 10px;
        font-size: 15px;
        font-family: inherit;
        border-radius: 12px;
        border: 1px solid rgba(168, 85, 247, 0.45);
        outline: none;
        color: #fff;
        background: rgba(20, 10, 30, 0.75);
    }
    input:focus {
        border-color: #c084fc;
        box-shadow: 0 0 12px rgba(168, 85, 247, 0.4);
    }
    input::placeholder { color: rgba(200, 160, 255, 0.4); }
    .row {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
    }
    button {
        width: 100%;
        min-height: 44px;
        border: none;
        border-radius: 12px;
        color: #fff;
        font-size: 13px;
        font-weight: 700;
        font-family: inherit;
        cursor: pointer;
        background: linear-gradient(135deg, #7c3aed, #a855f7);
        margin-top: 4px;
    }
    button:hover { filter: brightness(1.1); }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    button.secondary {
        background: linear-gradient(135deg, #4c1d95, #7c3aed);
    }
    button.danger {
        background: linear-gradient(135deg, #9f1239, #e11d48);
        min-height: 34px;
        width: auto;
        padding: 6px 12px;
        font-size: 12px;
        margin: 0;
    }
    #status {
        margin-top: 12px;
        font-size: 13px;
        color: #c084fc;
        text-align: center;
        min-height: 18px;
    }
    .list { display: flex; flex-direction: column; gap: 8px; }
    .item {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        padding: 10px 12px;
        border-radius: 10px;
        background: rgba(20, 10, 30, 0.7);
        border: 1px solid rgba(168, 85, 247, 0.3);
        font-size: 13px;
        word-break: break-all;
    }
    .empty {
        text-align: center;
        font-size: 13px;
        color: rgba(200, 160, 255, 0.4);
        padding: 12px;
    }
    .logout {
        position: fixed;
        top: 14px;
        right: 14px;
        z-index: 5;
        width: auto;
        min-height: 34px;
        padding: 8px 12px;
        font-size: 12px;
        background: rgba(30, 20, 40, 0.9);
        border: 1px solid rgba(168, 85, 247, 0.4);
    }
    .label {
        font-size: 11px;
        color: rgba(200, 160, 255, 0.5);
        margin-bottom: 6px;
        text-align: left;
    }
</style>
</head>
<body>

<button class="logout" id="logoutButton" type="button">Logout</button>

<h1>unity text</h1>

<div class="box">
    <div class="label">Object name (optional)</div>
    <input id="objectInput" type="text" placeholder="Leave blank for default" autocomplete="off">

    <div class="label">Text / event path</div>
    <input id="textInput" type="text" placeholder="Type here..." autocomplete="off">

    <button id="messageButton" type="button">Send text</button>
    <div class="row">
        <button class="secondary" id="eventButton" type="button">Turn on</button>
        <button class="secondary" id="clearButton" type="button">Clear</button>
    </div>
    <p id="status"></p>
</div>

<div class="box">
    <div class="label">On right now</div>
    <div class="list" id="activeList">
        <div class="empty">None</div>
    </div>
</div>

<script>
    const DB_URL = "https://my-text-1c7d9-default-rtdb.firebaseio.com/text.json";
    const ACTIVE_URL = "https://my-text-1c7d9-default-rtdb.firebaseio.com/active.json";

    const objectInput = document.getElementById("objectInput");
    const textInput = document.getElementById("textInput");
    const statusText = document.getElementById("status");
    const messageButton = document.getElementById("messageButton");
    const eventButton = document.getElementById("eventButton");
    const clearButton = document.getElementById("clearButton");
    const activeList = document.getElementById("activeList");

    messageButton.onclick = sendText;
    eventButton.onclick = turnOn;
    clearButton.onclick = clearAll;
    textInput.addEventListener("keydown", e => { if (e.key === "Enter") sendText(); });

    document.getElementById("logoutButton").onclick = async () => {
        try { await fetch("/api/logout", { method: "POST" }); }
        finally { location.href = "/login.html"; }
    };

    async function notify(type, value) {
        try {
            await fetch("/api/notify", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ type, value }),
            });
        } catch {}
    }

    async function sendText() {
        const msg = textInput.value.replace(/\\n/g, "\n").trim();
        if (!msg) { statusText.textContent = "Type something first"; return; }

        const obj = objectInput.value.trim();
        const value = obj ? "TEXT:" + obj + "|" + msg : msg;

        const ok = await put(value, obj ? "Sent to " + obj : "Sent");
        if (ok) {
            textInput.value = "";
            notify("message", value);
        }
    }

    async function turnOn() {
        const path = textInput.value.trim();
        if (!path) { statusText.textContent = "Type an object name first"; return; }

        const ok = await put("EVENT:" + path, "Turned on");
        if (ok) {
            textInput.value = "";
            notify("event", path);
            setTimeout(refresh, 800);
        }
    }

    async function turnOff(path) {
        const ok = await put("EVENT:-" + path, "Turned off");
        if (ok) {
            notify("event", "-" + path);
            setTimeout(refresh, 800);
        }
    }

    async function clearAll() {
        textInput.value = "";
        const ok = await put("", "Cleared");
        if (ok) {
            notify("clear", "");
            setTimeout(refresh, 800);
        }
    }

    async function put(value, okMsg) {
        messageButton.disabled = eventButton.disabled = clearButton.disabled = true;
        statusText.textContent = "Sending...";
        try {
            const res = await fetch(DB_URL, {
                method: "PUT",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(value),
            });
            if (!res.ok) throw new Error();
            statusText.textContent = okMsg;
            return true;
        } catch {
            statusText.textContent = "Error";
            return false;
        } finally {
            messageButton.disabled = eventButton.disabled = clearButton.disabled = false;
        }
    }

    function render(paths) {
        activeList.innerHTML = "";
        if (!paths.length) {
            activeList.innerHTML = '<div class="empty">None</div>';
            return;
        }
        for (const p of paths) {
            const row = document.createElement("div");
            row.className = "item";
            const span = document.createElement("span");
            span.textContent = p;
            const btn = document.createElement("button");
            btn.className = "danger";
            btn.textContent = "Off";
            btn.onclick = () => turnOff(p);
            row.append(span, btn);
            activeList.appendChild(row);
        }
    }

    async function refresh() {
        try {
            const res = await fetch(ACTIVE_URL + "?t=" + Date.now(), { cache: "no-store" });
            if (!res.ok) return;
            const data = await res.json();
            let list = [];
            if (Array.isArray(data)) list = data;
            else if (data && typeof data === "object") list = Object.values(data);
            render(list.filter(x => typeof x === "string" && x));
        } catch {}
    }

    refresh();
    setInterval(refresh, 1500);
</script>
</body>
</html>
